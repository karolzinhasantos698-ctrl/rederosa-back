spring.application.name=rederosa-back
spring.config.import=optional:file:./application-local.properties

# Configure GROQ_API_KEY no ambiente para habilitar o chat.
groq.api.key=${GROQ_API_KEY:}

spring.datasource.url=${AIVEN_DB_URL:jdbc:mysql://mysql-e840162-valdineymarcio21-704a.c.aivencloud.com:11223/rederosa?sslMode=REQUIRED}
spring.datasource.username=${AIVEN_DB_USER}
spring.datasource.password=${AIVEN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Endereço externo do backend para os links de acompanhamento (sem barra final).
# Se vazio, utiliza o endereço pelo qual a API foi acessada.
rederosa.public-base-url=${REDE_ROSA_PUBLIC_BASE_URL:}
